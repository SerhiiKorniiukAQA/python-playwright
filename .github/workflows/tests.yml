name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # every day at 08:00 Kyiv time
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Run only tests marked as smoke"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.15.11
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: ${{ matrix.name }} tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            marker: api
            needs_browser: false
          - name: UI
            marker: ui or e2e
            needs_browser: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        if: matrix.needs_browser
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          MARKER: ${{ inputs.smoke_only && format('({0}) and smoke', matrix.marker) || matrix.marker }}
        run: >
          pytest -m "$MARKER"
          -n 2 --reruns 1 --reruns-delay 2
          --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.name }}
          path: allure-results
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure() && matrix.needs_browser
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  report:
    name: Publish Allure report
    needs: tests
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v4
