name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # every day at 08:00 Kyiv time
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Run only tests marked as smoke"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  COMPOSE_FILE: docker/toolshop.compose.yml

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.15.11
      - run: ruff check .
      - run: ruff format --check .

  tests:
    # Both suites run against a fresh copy of Toolshop started in Docker on the runner:
    # - the public site blocks browsers on GitHub-hosted runners (bot protection);
    # - the public demo accounts are shared with everyone, so someone else can lock them
    #   (HTTP 423 after too many failed logins) and break the run.
    # A fresh, freshly seeded environment per run removes both problems.
    name: ${{ matrix.name }} tests (app in Docker)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            marker: api
            services: mariadb laravel-api web
            needs_browser: false
          - name: UI
            marker: ui or e2e
            services: mariadb laravel-api web angular-ui
            needs_browser: true
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v7

      - name: Start Toolshop in Docker
        run: docker compose up -d --quiet-pull ${{ matrix.services }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        if: matrix.needs_browser
        run: python -m playwright install --with-deps chromium

      - name: Create and seed the database
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed --force; then
              exit 0
            fi
            echo "Database not ready yet, retrying ($i/30)..."
            sleep 5
          done
          exit 1

      - name: Wait for the app
        env:
          WAIT_FOR_UI: ${{ matrix.needs_browser }}
        run: |
          wait_for() {  # name, url, timeout in seconds
            local deadline=$((SECONDS + $3)) code
            while (( SECONDS < deadline )); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$2" || true)
              echo "$1: HTTP $code"
              [[ "$code" == "200" ]] && return 0
              sleep 10
            done
            echo "::error::$1 did not become ready at $2 within $3 s"
            return 1
          }
          wait_for API "$API_URL/products" 300
          if [[ "$WAIT_FOR_UI" == "true" ]]; then wait_for UI "$BASE_URL" 900; fi

      - name: Run tests
        env:
          MARKER: ${{ inputs.smoke_only && format('({0}) and smoke', matrix.marker) || matrix.marker }}
        run: pytest -m "$MARKER" -n 2 --reruns 1 --reruns-delay 2 --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.name }}
          path: allure-results
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure() && matrix.needs_browser
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - name: Collect app logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color > docker-logs.txt
          tail -n 100 docker-logs.txt

      - name: Upload app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs-${{ matrix.name }}
          path: docker-logs.txt
          retention-days: 7

  report:
    name: Publish Allure report
    needs: tests
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Add history and CI info to the report
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Trend charts: take history from the previously published report (absent on the first run)
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sf "$REPORT_URL/history/$f" -o "allure-results/history/$f" || true
          done
          # "Executors" widget: link from the report back to this CI run
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "$RUN_URL",
            "reportUrl": "$REPORT_URL"
          }
          EOF

      - name: Generate report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v5
