# Reverse proxy in front of the Laravel API (php-fpm in the laravel-api container).
# Replaces the author's prebuilt web image, which is published for ARM only
# and fails on x86 GitHub runners with "exec format error".
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
