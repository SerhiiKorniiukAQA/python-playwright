[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --import-mode=importlib
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    api: API tests (no browser needed)
    ui: browser tests through the web UI
    e2e: flows combining API setup with UI checks
    smoke: short critical-path subset
