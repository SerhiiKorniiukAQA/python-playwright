[project]
name = "python-playwright"
version = "0.1.0"
description = "UI + API test automation framework for the Toolshop demo app (Python, Playwright, pytest)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "pages", "utils"]
